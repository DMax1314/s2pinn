# ============================================================
# sÂ²PINN: Stochastic Separable PINN â€?Inverse Burgers
# ============================================================

model:
  spatial:
    n_atoms: 256
    init_sigma: 0.15
    use_warp: true
    warp_hidden: 64
    warp_eps: 0.1

  temporal:
    n_freq: 8

  stochastic:
    R: 3
    p: 3
    dist: "gaussian"

  cp:
    rank: 16
    init: "normal"

pde:
  type: "inverse_burgers"
  name: "inverse_stochastic_burgers_2d"
  init_mu_k: 0.5    # Deliberately poor initial guess
  init_sigma: 0.5   # Deliberately poor initial guess
  domain:
    x_min: -1.0
    x_max: 1.0
    y_min: -1.0
    y_max: 1.0
    t_min: 0.0
    t_max: 1.0
  kl:
    n_terms: 3
    sigma: 1.0
    corr_length: 1.0

training:
  steps: 20000
  lr: 1.0e-3
  param_lr_mult: 10.0 # PDE parameters get 10x LR (1e-2)
  optimizer: "adam"
  amp: "none"
  grad_accum: 1

  colloc: 32768
  bc: 32768
  ic: 32768
  gram: 4096
  n_obs: 1000         # 1000 random observations from the true solution

  resample_every: 1

  w_data: 100.0       # Strong data matching term
  w_pde: 1.0
  w_proj: 1.0
  w_bc: 1.0
  w_ic: 1.0
  w_orth: 1.0
  w_fac_orth: 0.1

  normalize_cp_every: 1

eval:
  grid_res: 64
  t_eval: [0.0, 0.5, 1.0]
  z_eval:
    - name: "Z0"
      values: [0.0, 0.0, 0.0]
    - name: "Z_e1"
      values: [1.0, 0.0, 0.0]
    - name: "Z_e2"
      values: [0.0, 1.0, 0.0]
  eval_every: 500
  save_checkpoint: true
  uq:
    enabled: true
    n_probe: 2048
    n_z_moment: 1024
    n_z_interval: 1024
    n_z_test: 1024
    alpha: 0.1
    batch_limit: 262144

logging:
  use_wandb: false
  project: "s2pinn"
  entity: null
  log_every: 10

seed: 42
