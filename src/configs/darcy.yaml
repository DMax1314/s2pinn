# ============================================================
# s²PINN: Stochastic Darcy Flow (Divergence-Form Diffusion)
# ============================================================
# PDE:  u_t �?div(k(x,y,ω) ∇u) = f
# k(x,y,Z) = exp(μ_k + σ Σ √λᵢ Z�?φ�?x,y))  (log-normal via KL)
# Manufactured solution: u = sin(πx) sin(πy) exp(−t) exp(γ · KL_field)
#   �?nonlinear Z-dependence (genuinely hard UQ benchmark)

# --- Model Architecture ---
model:
  spatial:
    n_atoms: 256
    init_sigma: 0.15
    use_warp: true
    warp_hidden: 64
    warp_eps: 0.1
  temporal:
    n_freq: 8
  stochastic:
    R: 3
    p: 3
    dist: "gaussian"
  cp:
    rank: 16
    init: "normal"

# --- PDE Problem ---
pde:
  type: "darcy"
  name: "stochastic_darcy_2d"
  domain:
    x_min: -1.0
    x_max: 1.0
    y_min: -1.0
    y_max: 1.0
    t_min: 0.0
    t_max: 1.0
  kl:
    n_terms: 3
    sigma: 0.5          # moderate log-k variance (σ=0.5 �?k varies ~exp(±1))
    corr_length: 1.0
  darcy:
    gamma: 0.3           # nonlinearity strength (0.3 = moderate)

# --- Training ---
training:
  steps: 30000           # harder problem �?more steps
  lr: 5.0e-4             # slightly lower LR for stability
  optimizer: "adam"
  amp: "none"
  grad_accum: 1
  colloc: 32768
  bc: 32768
  ic: 32768
  gram: 4096
  resample_every: 1
  w_pde: 1.0
  w_proj: 1.0
  w_bc: 10.0             # stronger BC enforcement (divergence form can drift)
  w_ic: 10.0
  w_orth: 1.0
  w_fac_orth: 0.1
  normalize_cp_every: 1

# --- Evaluation ---
eval:
  grid_res: 64
  t_eval: [0.0, 0.5, 1.0]
  z_eval:
    - name: "Z0"
      values: [0.0, 0.0, 0.0]
    - name: "Z_e1"
      values: [1.0, 0.0, 0.0]
    - name: "Z_e2"
      values: [0.0, 1.0, 0.0]
  eval_every: 500
  save_checkpoint: true
  uq:
    enabled: true
    n_probe: 2048
    n_z_moment: 1024
    n_z_interval: 1024
    n_z_test: 1024
    alpha: 0.1
    batch_limit: 262144

# --- Logging ---
logging:
  use_wandb: false
  project: "s2pinn"
  entity: null
  log_every: 10

# --- Reproducibility ---
seed: 42
