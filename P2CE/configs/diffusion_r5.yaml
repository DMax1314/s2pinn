seed: 42

problem:
  name: diffusion_r5
  type: diffusion
  R: 5
  sigma: 1.0
  corr_length: 1.0
  mu_k: 0.0
  domain:
    x: [-1.0, 1.0]
    y: [-1.0, 1.0]
    t: [0.0, 1.0]

pc2:
  p: 3
  solver: ols
  n_boundary: 2048
  n_initial: 2048
  n_virtual: -1
  n_error_points: 4096
  n_validation: 4096
  batch_size: 200000

evaluation:
  grid_res: 64
  t_value: 1.0
  calibration:
    n_probe: 512
    n_z: 512
    levels: [0.5, 0.8, 0.9, 0.95]

logging:
  use_wandb: false
  project: s2pinn
  entity:

output:
  dir: ~/s2PINN/P2CE/results
  save_model: false
